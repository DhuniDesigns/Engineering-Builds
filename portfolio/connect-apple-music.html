<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Apple Music</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:64px auto;padding:0 16px;background:#0e0e0e;color:#eee}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#fa2d48;color:#fff;cursor:pointer}
textarea{width:100%;height:140px;margin-top:16px;background:#151515;color:#eee;border:1px solid #2a2a2a;border-radius:10px;padding:10px;font:13px ui-monospace,monospace}</style>
<h1>Connect Apple Music</h1>
<p>Open this page once, sign in with your Apple ID, then copy the token into Vercel as <code>APPLE_MUSIC_USER_TOKEN</code>. Delete this page from the site afterwards.</p>
<button id="go">Sign in to Apple Music</button>
<textarea id="out" readonly placeholder="Your user token will appear here"></textarea>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
<script>
document.getElementById("go").onclick = async () => {
  const music = await MusicKit.configure({ developerToken: (await (await fetch("/api/dev-token")).json()).token, app: { name: "Dhuni Designs", build: "1.0" } });
  document.getElementById("out").value = await music.authorize();
};
</script>
