/* theme */
const root=document.documentElement, themeBtn=document.getElementById("theme");
function setTheme(light){ root.setAttribute("data-mode", light?"light":"dark"); themeBtn.setAttribute("aria-pressed", light);
  themeBtn.setAttribute("aria-label", light?"Switch to dark mode":"Switch to light mode"); try{localStorage.setItem("dd-theme", light?"light":"dark")}catch(_){} }
let saved=null; try{saved=localStorage.getItem("dd-theme")}catch(_){}
setTheme(saved==="light");
let themeBusy=false;
themeBtn.addEventListener("click",()=>{
  if(themeBusy) return;
  const toLight=root.getAttribute("data-mode")!=="light"; sfx.theme(toLight);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ setTheme(toLight); return; }
  themeBusy=true;
  themeBtn.setAttribute("aria-pressed",String(toLight));   // the icon morphs right away, the circle grows out of it
  const r=themeBtn.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  // Size the circle to what's on screen. Inside Claude the page can sit in a frame much taller than the
  // window, and a circle sized to that frame would cover the visible part in a few frames.
  const W=document.documentElement.clientWidth, visH=Math.min(innerHeight,(window.screen&&screen.availHeight)||innerHeight);
  const rad=Math.ceil(Math.hypot(Math.max(x,W-x),Math.max(y,visH-y)))+40;

  // 1. copy the page and give the copy the new theme
  const wrap=document.createElement("div"); wrap.className="theme-clone"; wrap.setAttribute("data-mode",toLight?"light":"dark"); wrap.setAttribute("aria-hidden","true");
  const inner=document.createElement("div"); inner.className="clone-in";
  const bs=getComputedStyle(document.body);
  inner.style.width=document.body.getBoundingClientRect().width+"px"; inner.style.padding=bs.padding;
  ["header","main","footer"].forEach(sel=>{
    const src=document.querySelector(sel), n=src.cloneNode(true);
    n.removeAttribute("id"); n.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id")); n.querySelectorAll("canvas").forEach(c=>c.remove());
    inner.appendChild(n);
  });
  const btns=inner.querySelectorAll("header .icon-btn"); if(btns[1]) btns[1].setAttribute("aria-pressed",String(toLight));
  wrap.appendChild(inner); document.body.appendChild(wrap);
  const realStrip=document.querySelector("#app .strip"), copyStrip=inner.querySelector(".strip"); if(realStrip&&copyStrip) copyStrip.scrollLeft=realStrip.scrollLeft;
  // 2. line the copy up exactly over the real page
  const a=document.querySelector("header").getBoundingClientRect(), b=inner.querySelector("header").getBoundingClientRect();
  inner.style.transform=`translate(${a.left-b.left}px,${a.top-b.top}px)`;

  // 3. the icon swells into a bubble of the new theme, holds for a beat, then that bubble spreads over the page.
  // Driven frame by frame on purpose: inside Claude's viewer on high-density screens, the browser's
  // hardware-accelerated clip-path animation draws the circle at the wrong scale. Setting it each frame avoids that.
  const BUB=Math.max(22,r.width*1.1), A=200, B=820, t0=performance.now();
  const backOut=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};      // little overshoot: the icon "pops"
  const inOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;                                      // gathers, then sweeps, then settles
  wrap.style.clipPath=`circle(0px at ${x}px ${y}px)`;
  (function step(now){
    const e=now-t0;
    const rr = e<A ? BUB*backOut(Math.min(1,e/A)) : BUB+(rad-BUB)*inOut(Math.min(1,(e-A)/B));
    wrap.style.clipPath=`circle(${Math.max(0,rr).toFixed(1)}px at ${x}px ${y}px)`;
    if(e<A+B) return requestAnimationFrame(step);
    root.classList.add("vt-run"); setTheme(toLight);
    requestAnimationFrame(()=>{ wrap.remove(); requestAnimationFrame(()=>root.classList.remove("vt-run")); themeBusy=false; });
  })(t0);
});

/* ---- sound kit: every sound is synthesised, no files ----
   hover: tiny glassy tick · click: soft two-part tap · tab: pluck · page: airy swipe
   theme: low thump for dark, bright chime for light · sound on/off: rising/falling pair · copy: little ding */
const soundBtn=document.getElementById("sound"), player=document.getElementById("player");
let soundOn=false, ctx=null, master=null, lastHover=0;
function audio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.9;
  const comp=ctx.createDynamicsCompressor(); master.connect(comp).connect(ctx.destination);} ctx.resume(); return ctx; }
function tone(f,{type="sine",dur=.08,vol=.05,to=null,delay=0,attack=.004}={}){
  if(!soundOn||!ctx) return; const t=ctx.currentTime+delay, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.12,vol=.04,from=800,to=3000,q=1.2,delay=0}={}){
  if(!soundOn||!ctx) return; const t=ctx.currentTime+delay, n=Math.floor(ctx.sampleRate*dur), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=b; f.type="bandpass"; f.Q.value=q;
  f.frequency.setValueAtTime(from,t); f.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur);
}
const sfx={
  hover(){ const n=performance.now(); if(n-lastHover<45) return; lastHover=n; tone(2400,{dur:.03,vol:.012,type:"triangle"}); },
  click(){ noise({dur:.03,vol:.05,from:3000,to:1800,q:3}); tone(620,{dur:.07,vol:.04,to:420}); },
  tab(){ tone(880,{dur:.12,vol:.035,type:"triangle",to:860}); tone(1320,{dur:.09,vol:.015,delay:.012}); },
  page(){ noise({dur:.22,vol:.03,from:500,to:2600,q:.8}); },
  theme(light){ light ? (tone(1046,{dur:.25,vol:.03,type:"triangle"}),tone(1568,{dur:.3,vol:.02,delay:.05}))
                      : (tone(140,{dur:.22,vol:.07,to:70}),noise({dur:.08,vol:.02,from:400,to:200})); },
  copy(){ tone(1318,{dur:.12,vol:.03,type:"triangle"}); tone(1760,{dur:.18,vol:.03,type:"triangle",delay:.07}); },
  on(){ tone(523,{dur:.1,vol:.04,type:"triangle"}); tone(784,{dur:.16,vol:.04,type:"triangle",delay:.08}); },
  off(){ tone(784,{dur:.08,vol:.035,type:"triangle"}); tone(392,{dur:.14,vol:.035,type:"triangle",delay:.07}); },
};
function setSound(on){
  if(on){ try{ audio(); }catch(_){} soundOn=true; sfx.on(); } else { sfx.off(); soundOn=false; }
  soundBtn.setAttribute("aria-pressed",on); soundBtn.setAttribute("aria-label",on?"Turn sound off":"Turn sound on");
  player.classList.toggle("playing",on);
}
soundBtn.addEventListener("click",()=>setSound(!soundOn));

/* ---- product preview on the bio highlights ---- */
const pv=document.getElementById("pv");
const P={on:false,s:0,vs:0,x:0,vx:0,tx:0,y:0,raf:0,w:300,h:188,link:null};
function pvLoop(){
  // two small springs: one for the pop (scale), one for the sideways follow
  const k=380,d=24,dt=1/60;
  const ts=P.on?1:0; P.vs+=(k*(ts-P.s)-d*P.vs)*dt; P.s+=P.vs*dt;
  P.vx+=(260*(P.tx-P.x)-26*P.vx)*dt; P.x+=P.vx*dt;
  const sc=.35+.65*Math.max(0,P.s);
  pv.style.transform=`translate3d(${P.x}px,${P.y}px,0) scale(${sc})`;
  pv.style.opacity=Math.max(0,Math.min(1,P.s*1.6));
  if(!P.on && P.s<.02 && Math.abs(P.vs)<.05){ pv.style.opacity=0; P.raf=0; return; }
  P.raf=requestAnimationFrame(pvLoop);
}
function aimPv(cx){ P.tx=Math.max(12,Math.min(innerWidth-P.w-12,cx-P.w/2)); }
function showPv(h,cx){
  const d=PRODUCTS[h.dataset.prod]; if(!d) return;
  if(P.link!==h){ pv.style.setProperty("--c",getComputedStyle(h).getPropertyValue("--c")); pv.innerHTML=d.art; P.link=h; }
  const r=h.getBoundingClientRect(); let y=r.top-P.h-12, below=false;
  if(y<12){ y=r.bottom+12; below=true; }
  pv.classList.toggle("below",below); P.y=y;
  aimPv(cx??r.left+r.width/2);
  if(!P.on && P.s<.05){ P.x=P.tx; P.vx=0; P.s=0; P.vs=0; }
  P.on=true; if(!P.raf) P.raf=requestAnimationFrame(pvLoop);
}
const hidePv=()=>{ P.on=false; P.link=null; if(!P.raf) P.raf=requestAnimationFrame(pvLoop); };
document.addEventListener("pointerover",e=>{ const h=e.target.closest&&e.target.closest(".hl"); if(h&&e.pointerType==="mouse"&&!h.contains(e.relatedTarget)) showPv(h,e.clientX); });
document.addEventListener("pointermove",e=>{ if(P.on&&P.link&&e.target.closest&&e.target.closest(".hl")===P.link) aimPv(e.clientX); });
document.addEventListener("pointerout",e=>{ const h=e.target.closest&&e.target.closest(".hl"); if(h&&!h.contains(e.relatedTarget)) hidePv(); });
document.addEventListener("focusin",e=>{ if(e.target.matches&&e.target.matches(".hl")) showPv(e.target); });

let stickerLayer=null, stickerEls=[], stkRaf=0, stkQ=[], stkT=0, stkStart=0, stkRank=[];
const clamp=v=>v<0?0:v>1?1:v, smooth=t=>t*t*(3-2*t);
function mountStickers(){
  unmountStickers(); if(!document.getElementById("collage")) return;
  stickerLayer=document.createElement("div"); stickerLayer.className="stickers"+(root.hasAttribute("data-booting")?" hold":""); stickerLayer.setAttribute("aria-hidden","true");
  stickerLayer.innerHTML=STICKERS.map(s=>`<div class="stk" style="width:${s.w}px;height:${s.h}px"><div class="stk-in ${s.kind.split(" ").map((c,j)=>j?c:"stk-"+c).join(" ")}">${typeof s.html==="function"?s.html():s.html}</div></div>`).join("");
  document.body.appendChild(stickerLayer); stickerEls=[...stickerLayer.children]; placeStickers(); initCards();
}
function unmountStickers(){ stkQ=[]; stkStart=0; if(stickerLayer){ stickerLayer.remove(); stickerLayer=null; stickerEls=[]; } }
function placeStickers(){
  stkRaf=0; const col=document.getElementById("collage"); if(!col||!stickerLayer) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const r=col.getBoundingClientRect(), W=innerWidth, H=innerHeight, sc=r.width/STICKER_W, now=performance.now();
  // one calm, choreographed entrance: it starts once the collage is properly on screen and then plays on its own clock,
  // so it feels the same however fast you scroll. Pieces bloom out from the middle of the board.
  if(!stkStart && r.top<H*.78 && r.bottom>H*.15) stkStart=now;
  if(!stkRank.length){ const cx=STICKER_W/2, cy=STICKER_H/2;
    const order=STICKERS.map((s,i)=>[i,Math.hypot((s.slot.x-cx)/STICKER_W,(s.slot.y-cy)/STICKER_H)]).sort((a,b)=>a[1]-b[1]);
    order.forEach(([i],k)=>stkRank[i]=k); }
  const DUR=1250, GAP=55, t=stkStart? now-stkStart : -1;
  const wide=W>=900;
  // spring-like settle: fast start, long soft landing with a whisper of overshoot
  const ease=x=>{ if(x<=0) return 0; if(x>=1) return 1; const c=.9; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
  let moving=false;
  STICKERS.forEach((s,i)=>{
    const lt=reduce?1:(t<0?0:Math.min(1,Math.max(0,(t-stkRank[i]*GAP)/DUR)));
    if(lt<1) moving=true; stkQ[i]=lt;
    const q=ease(lt), e=1-q;                              // e: 1 = away, 0 = landed
    const tx=r.left+s.slot.x*sc-s.w/2, ty=r.top+s.slot.y*sc-s.h/2;
    const dx=(s.slot.x-STICKER_W/2)/STICKER_W, dir=i%2?1:-1;
    const travel=wide?1:.6;
    const x=tx+dx*120*travel*e, y=ty+(70+(i%4)*14)*travel*e;
    const rot=s.slot.rot+dir*(10+(i%3)*4)*e, k=sc*(1+.06*e);
    const el=stickerEls[i];
    el.style.transform=`translate3d(${x}px,${y}px,0) rotate(${rot}deg) scale(${k})`;
    el.style.opacity=lt<=0?0:Math.min(1,lt/.35);
    el.style.filter=lt>0&&lt<.5?`blur(${((.5-lt)/.5*3).toFixed(2)}px)`:"";
    el.classList.toggle("set",lt>=1);
  });
  if(moving&&stkStart) queueStickers();
}
const queueStickers=()=>{ if(!stkRaf) stkRaf=requestAnimationFrame(placeStickers); };
addEventListener("scroll",queueStickers,{passive:true}); addEventListener("resize",queueStickers);

let blIdx=0, blTimer=0, blHold=false;
let blSet=function(st){ bl.dataset.state=st; };
function blNext(){ if(!blHold){ const [st,ms]=CYCLE[blIdx%CYCLE.length]; blIdx++; blSet(st); blTimer=setTimeout(blNext,ms); } }

  const W=innerWidth, H=innerHeight;
  const blocks=[...document.querySelectorAll(".blob,.brand-name,.tools,.crumb,h1,.lede,.intro > *,.tabs,.tile,.card,.shot,.sub,.contact,.cs-links,.sections > *,.player,.foot")]
    .map(el=>{ const r=el.getBoundingClientRect(); return {el,x:r.left,y:r.top,w:r.width,h:Math.max(r.height,1),rad:parseFloat(getComputedStyle(el).borderTopLeftRadius)||0}; })
    .filter(b=>b.w>1 && b.y<H-4 && b.y+b.h>0 && b.x<W && b.x+b.w>0)
    .sort((a,b)=>a.y-b.y||a.x-b.x);
  if(!blocks.length){ root.removeAttribute("data-booting"); afterBoot(); return; }
  const colR=document.querySelector("header.col").getBoundingClientRect(), colX=[colR.left-.5, colR.right+.5];
  const rows=[...new Set(blocks.map(b=>Math.round(b.y)))].filter((y,i,a)=>i===0||y-a[i-1]>6);
  const ink="#ffd1e6";   // light pink, drawn at 30%

  blocks.forEach(b=>{ b.el.style.opacity="0"; });
  root.removeAttribute("data-booting");

  const cv=document.createElement("canvas"); cv.className="boot-canvas"; cv.setAttribute("aria-hidden","true"); document.body.appendChild(cv);
  const dpr=Math.min(devicePixelRatio||1,2); cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.lineWidth=1.2; c.strokeStyle=ink; c.shadowColor="rgba(255,190,220,.6)"; c.shadowBlur=5;

  const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3), io=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const STEP=Math.min(18, 220/blocks.length), TRACE=220, GUIDE=200;
  const traceEnd=60+(blocks.length-1)*STEP+TRACE, REVEAL=traceEnd-80, RSTEP=Math.min(16,200/blocks.length);
  const END=REVEAL+(blocks.length-1)*RSTEP+280;
  blocks.forEach((b,i)=>{ b.t0=60+i*STEP; b.r0=REVEAL+i*RSTEP; b.shown=false; });

  let t0=0, raf=0, done=false;
  function rr(b){ const r=Math.min(b.rad,b.h/2,b.w/2); c.beginPath(); c.roundRect ? c.roundRect(b.x+.5,b.y+.5,b.w-1,b.h-1,r) : c.rect(b.x+.5,b.y+.5,b.w-1,b.h-1); }
  function show(b,instant){ if(b.shown) return; b.shown=true; b.el.style.opacity="";
    if(!instant) b.el.animate([{opacity:0,filter:"blur(4px)",transform:"translateY(6px)"},{opacity:1,filter:"blur(0)",transform:"none"}],{duration:300,easing:"cubic-bezier(.2,.7,.2,1)"}); }
  function finish(){ if(done) return; done=true; cancelAnimationFrame(raf);
    blocks.forEach(b=>show(b,true)); cv.animate([{opacity:1},{opacity:0}],{duration:200}).onfinish=()=>cv.remove();
    ["pointerdown","keydown"].forEach(ev=>removeEventListener(ev,finish)); afterBoot(); }
  ["pointerdown","keydown"].forEach(ev=>addEventListener(ev,finish,{once:true}));
  setTimeout(finish, 2500);   // safety net: never leave the page hidden (e.g. a background tab that pauses animation frames)

  function frame(now){
    if(!t0) t0=now; const t=now-t0; c.clearRect(0,0,W,H);
    const fadeAll=1-io((t-REVEAL)/260);
    // 0. a 12-column layout grid drops in, left to right
    c.setLineDash([]); c.shadowBlur=0;
    for(let k=1;k<12;k++){ const p=ease((t-k*14)/260); if(p<=0) continue;
      const x=Math.round(colX[0]+(colX[1]-colX[0])*k/12)+.5; c.globalAlpha=.12*fadeAll;
      c.beginPath(); c.moveTo(x,0); c.lineTo(x,H*p); c.stroke(); }
    c.shadowBlur=5;
    // 1. column guides
    c.setLineDash([3,4]); c.globalAlpha=.3*fadeAll;
    const g=ease(t/GUIDE)*H/2;
    colX.forEach(x=>{ c.beginPath(); c.moveTo(x,H/2-g); c.lineTo(x,H/2+g); c.stroke(); });
    // 1b. width marker above the column, like a measurement in Figma
    { const p=ease((t-90)/240); if(p>0){ const y=Math.max(18,rows[0]-22), mid=(colX[0]+colX[1])/2, half=(colX[1]-colX[0])/2*p;
      c.setLineDash([]); c.globalAlpha=.3*fadeAll; c.beginPath(); c.moveTo(mid-half,y); c.lineTo(mid+half,y);
      c.moveTo(mid-half,y-4); c.lineTo(mid-half,y+4); c.moveTo(mid+half,y-4); c.lineTo(mid+half,y+4); c.stroke();
      if(p>.8){ c.fillStyle=ink; c.font="500 10px Outfit,system-ui,sans-serif"; c.textAlign="center"; const lbl=String(Math.round(colR.width));
        const tw=c.measureText(lbl).width+10; c.globalAlpha=.9*fadeAll; c.fillStyle="#0e0e0e"; c.fillRect(mid-tw/2,y-7,tw,14); c.globalAlpha=.55*fadeAll; c.fillStyle=ink; c.fillText(lbl,mid,y+3.5); } } }
    // 2. row guides
    rows.forEach((y,i)=>{ const p=ease((t-30-i*10)/GUIDE)*W/2; if(p<=0) return;
      c.setLineDash([3,4]); c.globalAlpha=.3*fadeAll; c.beginPath(); c.moveTo(W/2-p,y+.5); c.lineTo(W/2+p,y+.5); c.stroke();
      // crosshairs where a row meets the column edges
      const q=ease((t-120-i*10)/180); if(q>0){ c.setLineDash([]); c.globalAlpha=.3*fadeAll*q;
        colX.forEach(x=>{ c.beginPath(); c.moveTo(x-5,y+.5); c.lineTo(x+5,y+.5); c.moveTo(x,y-5); c.lineTo(x,y+5); c.stroke(); }); } });
    // 3 + 4. outlines sweep round, then hand over to the real block
    blocks.forEach(b=>{
      const p=ease((t-b.t0)/TRACE); if(p<=0) return;
      const out=1-io((t-b.r0)/200); if(t>=b.r0) show(b);
      if(out<=0) return;
      const cx=b.x+b.w/2, cy=b.y+b.h/2, R=Math.hypot(b.w,b.h);
      c.save(); c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*p); c.closePath(); c.clip();
      c.setLineDash([4,3]); c.globalAlpha=.3*out; rr(b); c.stroke(); c.restore();
    });
    c.globalAlpha=1;
    if(t>=END) return finish();
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}

render(); boot();
</script>

</html>
