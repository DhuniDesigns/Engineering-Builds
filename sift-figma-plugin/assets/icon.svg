<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3B0"/><stop offset=".55" stop-color="#F6C46E"/><stop offset="1" stop-color="#EE9F45"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C8A86"/><stop offset=".25" stop-color="#F4F6F5"/><stop offset=".5" stop-color="#B9C3C0"/><stop offset=".78" stop-color="#FFFFFF"/><stop offset="1" stop-color="#6F7C78"/></linearGradient>
 <linearGradient id="rimBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E6B67"/><stop offset="1" stop-color="#97A39F"/></linearGradient>
 <radialGradient id="bowlShade" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".5" stop-color="#9AA7A3" stop-opacity=".15"/><stop offset="1" stop-color="#22302C" stop-opacity=".55"/></radialGradient>
 <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#AEB9B5"/><stop offset="1" stop-color="#5E6B67"/></linearGradient>
 <pattern id="mesh" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><path d="M0 0H3.2M0 0V3.2" stroke="#E9EEEC" stroke-width=".7"/></pattern>
 <clipPath id="bowl"><path d="M24 56a40 13 0 0 0 80 0 40 44 0 0 1-80 0z"/></clipPath>
 <clipPath id="bowlFull"><path d="M24 56a40 13 0 0 1 80 0 40 44 0 0 1-80 0z"/></clipPath>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7A3E00" flood-opacity=".28"/></filter>
 <filter id="tile" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#5A2E00" flood-opacity=".35"/></filter>
</defs>
<rect width="128" height="128" rx="30" fill="url(#bg)"/>
<!-- scattered images falling in -->
<g filter="url(#tile)">
 <rect x="30" y="13" width="17" height="13" rx="3" fill="#7FA77A" stroke="#fff" stroke-width="1.6" transform="rotate(-22 38 19)"/>
 <rect x="56" y="8" width="13" height="17" rx="3" fill="#3F6BAE" stroke="#fff" stroke-width="1.6" transform="rotate(14 62 16)"/>
 <rect x="77" y="18" width="16" height="12" rx="3" fill="#C25B76" stroke="#fff" stroke-width="1.6" transform="rotate(28 85 24)"/>
 <rect x="46" y="32" width="11" height="11" rx="2.5" fill="#8B63B3" stroke="#fff" stroke-width="1.4" transform="rotate(-10 51 37)"/>
</g>
<!-- back rim -->
<path d="M24 56a40 13 0 0 1 80 0" fill="none" stroke="url(#rimBack)" stroke-width="5"/>
<!-- bowl: mesh + shading -->
<g clip-path="url(#bowlFull)" filter="url(#soft)">
 <path d="M24 56a40 13 0 0 1 80 0 40 44 0 0 1-80 0z" fill="#8E9C98"/>
 <rect x="20" y="40" width="90" height="70" fill="url(#mesh)" opacity=".9"/>
 <path d="M24 56a40 13 0 0 1 80 0 40 44 0 0 1-80 0z" fill="url(#bowlShade)"/>
 <!-- a tile half-way through, visible inside the bowl -->
 <rect x="60" y="56" width="12" height="10" rx="2.4" fill="#D9824B" stroke="#fff" stroke-width="1.3" transform="rotate(-18 66 61)" opacity=".95"/>
</g>
<!-- inner rim lip shading -->
<path d="M24 56a40 13 0 0 0 80 0" fill="none" stroke="#2C3A36" stroke-opacity=".35" stroke-width="3" transform="translate(0 2)"/>
<!-- front rim -->
<path d="M24 56a40 13 0 0 0 80 0" fill="none" stroke="url(#metal)" stroke-width="5.5" stroke-linecap="round"/>
<path d="M30 61a36 10 0 0 0 30 6" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
<!-- handle -->
<path d="M102 52 L121 33" stroke="url(#handle)" stroke-width="7" stroke-linecap="round"/>
<path d="M103 50 L120 33" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
<circle cx="121.5" cy="32.5" r="3.3" fill="#E9EEEC" stroke="#6F7C78" stroke-width="1"/>
<!-- arranged output -->
<g filter="url(#tile)">
 <rect x="35" y="106" width="12" height="12" rx="2.6" fill="#7FA77A" stroke="#fff" stroke-width="1.3"/>
 <rect x="50" y="106" width="12" height="12" rx="2.6" fill="#D9824B" stroke="#fff" stroke-width="1.3"/>
 <rect x="65" y="106" width="12" height="12" rx="2.6" fill="#3F6BAE" stroke="#fff" stroke-width="1.3"/>
 <rect x="80" y="106" width="12" height="12" rx="2.6" fill="#C25B76" stroke="#fff" stroke-width="1.3"/>
</g>
</svg>
